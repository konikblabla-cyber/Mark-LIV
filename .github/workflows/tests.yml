name: Mark-LIV tests

on:
  push:
  pull_request:

jobs:
  action-source-validation:
    strategy:
      fail-fast: false
      matrix:
        range:
          - { start: 5, end: 7 }
          - { start: 7, end: 10 }
          - { start: 10, end: 13 }
          - { start: 13, end: 15 }
          - { start: 20, end: 23 }
          - { start: 23, end: 25 }
          - { start: 30, end: 33 }
          - { start: 33, end: 35 }
          - { start: 50, end: 53 }
          - { start: 53, end: 55 }
          - { start: 170, end: 173 }
          - { start: 173, end: 175 }
    runs-on: ubuntu-latest
    name: Action validation ${{ matrix.range.start }}-${{ matrix.range.end }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate action sources
        env:
          ACTION_START: ${{ matrix.range.start }}
          ACTION_END: ${{ matrix.range.end }}
        run: python -m unittest tests.test_action_sources -v

  regression:
    needs: action-source-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run regression tests
        run: python -m unittest tests.test_suite -v
