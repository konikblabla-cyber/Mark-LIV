name: Mark-LIV tests

on:
  push:
  pull_request:

jobs:
  action-source-validation:
    strategy:
      fail-fast: false
      matrix:
        range:
          - { start: 0, end: 5 }
          - { start: 5, end: 10 }
          - { start: 10, end: 15 }
          - { start: 15, end: 20 }
          - { start: 20, end: 25 }
          - { start: 25, end: 30 }
          - { start: 30, end: 35 }
          - { start: 35, end: 40 }
          - { start: 50, end: 55 }
          - { start: 55, end: 60 }
          - { start: 170, end: 175 }
          - { start: 175, end: 180 }
    runs-on: ubuntu-latest
    name: Action validation ${{ matrix.range.start }}-${{ matrix.range.end }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate action sources
        env:
          ACTION_START: ${{ matrix.range.start }}
          ACTION_END: ${{ matrix.range.end }}
        run: python -m unittest tests.test_action_sources -v

  regression:
    needs: action-source-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run regression tests
        run: python -m unittest tests.test_suite -v
