name: Mark-LIV tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile every Python source
        run: python -m compileall -q .

      - name: Smoke import main
        shell: pwsh
        run: |
          python -c 'import main; print("MARK-LIV main import: OK")'

      - name: Validate all action sources
        run: python -m unittest tests.test_action_sources -v
      - name: Run regression tests
        run: python -m unittest tests.test_suite -v
